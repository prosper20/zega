name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      # Placeholders so modules can initialise during `next build`; no network access happens.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (Biome)
        run: npx biome ci src tests
      - name: Type check
        run: npm run typecheck
      - name: Unit, database (PGlite) and component tests with coverage
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            reports/
            coverage/

  e2e:
    name: End-to-end (Playwright)
    needs: quality
    # Runs against a deployed environment (e.g. the Vercel preview) when E2E_BASE_URL is configured.
    if: ${{ vars.E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
