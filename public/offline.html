<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | ZEGA</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; background: #f4f9fd; color: #101828; }
      @media (prefers-color-scheme: dark) { body { background: #021021; color: #e8efff; } }
      main { max-width: 22rem; padding: 2rem; text-align: center; }
      .tile { width: 56px; height: 56px; border-radius: 14px; background: #246cff; margin: 0 auto 1.25rem; }
      h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
      p { opacity: .75; line-height: 1.5; }
      button { margin-top: 1rem; border: 0; border-radius: 8px; background: #246cff; color: #fff; padding: .7rem 1.2rem; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="tile" aria-hidden="true"></div>
      <h1>You are offline</h1>
      <p>ZEGA needs a connection to load your requests and jobs. Move to an area with signal and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
